plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'ru.mirea.rksp'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.13'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('jacocoCriticalLayerCoverageVerification', JacocoCoverageVerification) {
    dependsOn tasks.named('test')

    executionData.from(fileTree(layout.buildDirectory).include('/jacoco/test.exec'))
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(files(layout.buildDirectory.dir('classes/java/main')).asFileTree.matching {
        include 'ru/mirea/rksp/backend/service/*.class'
        include 'ru/mirea/rksp/backend/mapper/ApiMapper.class'
        include 'ru/mirea/rksp/backend/exception/GlobalExceptionHandler.class'
    })

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}

tasks.register('jacocoCriticalLayerReport', JacocoReport) {
    dependsOn tasks.named('test')

    executionData.from(fileTree(layout.buildDirectory).include('/jacoco/test.exec'))
    sourceDirectories.from(files('src/main/java'))
    classDirectories.from(files(layout.buildDirectory.dir('classes/java/main')).asFileTree.matching {
        include 'ru/mirea/rksp/backend/service/*.class'
        include 'ru/mirea/rksp/backend/mapper/ApiMapper.class'
        include 'ru/mirea/rksp/backend/exception/GlobalExceptionHandler.class'
    })

    reports {
        xml.required = true
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/critical-layer/html')
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/critical-layer/critical-layer.xml')
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoCriticalLayerCoverageVerification')
    dependsOn tasks.named('jacocoCriticalLayerReport')
}
