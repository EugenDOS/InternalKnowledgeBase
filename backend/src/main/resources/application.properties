spring.application.name=backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledge_base}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.auth.secret=${APP_AUTH_SECRET:knowledge-base-demo-secret}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:knowledge-base-session}
app.auth.cookie-max-age=${APP_AUTH_COOKIE_MAX_AGE:604800}
app.auth.secure-cookie=${APP_AUTH_SECURE_COOKIE:false}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
