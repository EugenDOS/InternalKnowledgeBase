services:
  postgres:
    image: eugendos/knowledge-base-postgres:latest
    restart: unless-stopped
    command: ["postgres", "-p", "${POSTGRES_PORT:?Set POSTGRES_PORT in .env}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p ${POSTGRES_PORT:?Set POSTGRES_PORT in .env}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: eugendos/knowledge-base-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${BACKEND_PORT:?Set BACKEND_PORT in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?Set APP_AUTH_SECRET in .env}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:?Set APP_AUTH_COOKIE_NAME in .env}
      APP_AUTH_COOKIE_MAX_AGE: ${APP_AUTH_COOKIE_MAX_AGE:?Set APP_AUTH_COOKIE_MAX_AGE in .env}
      APP_AUTH_SECURE_COOKIE: ${APP_AUTH_SECURE_COOKIE:?Set APP_AUTH_SECURE_COOKIE in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS in .env}
    networks:
      - frontend_network
      - backend_network

  frontend:
    image: eugendos/knowledge-base-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: ${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in .env}
      BACKEND_INTERNAL_URL: http://backend:${BACKEND_PORT:?Set BACKEND_PORT in .env}
      BACKEND_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:?Set APP_AUTH_COOKIE_NAME in .env}
    ports:
      - "${FRONTEND_HOST_PORT:?Set FRONTEND_HOST_PORT in .env}:${FRONTEND_CONTAINER_PORT:?Set FRONTEND_CONTAINER_PORT in .env}"
    networks:
      - frontend_network

volumes:
  postgres_data:

networks:
  frontend_network:
  backend_network:
