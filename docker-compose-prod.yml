services:
  postgres:
    image: eugendos/knowledge-base-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_base}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_base}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: eugendos/knowledge-base-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-knowledge_base}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:-change-me-in-production}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-knowledge-base-session}
      APP_AUTH_COOKIE_MAX_AGE: ${APP_AUTH_COOKIE_MAX_AGE:-604800}
      APP_AUTH_SECURE_COOKIE: ${APP_AUTH_SECURE_COOKIE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://rksp.b90320ye.beget.tech}
    expose:
      - "8080"
    networks:
      - frontend_network
      - backend_network

  frontend:
    image: eugendos/knowledge-base-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://rksp.b90320ye.beget.tech}
      BACKEND_INTERNAL_URL: http://backend:8080
      BACKEND_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-knowledge-base-session}
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    networks:
      - frontend_network

volumes:
  postgres_data:

networks:
  frontend_network:
  backend_network:
