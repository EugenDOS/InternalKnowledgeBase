services:
  postgres:
    image: postgres:17-alpine
    container_name: knowledge-base-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_base
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./frontend/scripts/migrate.sql:/docker-entrypoint-initdb.d/01-migrate.sql:ro
    networks:
      - backend_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_base"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-base-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/knowledge_base
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_AUTH_SECRET: knowledge-base-demo-secret
      APP_AUTH_COOKIE_NAME: knowledge-base-session
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8080:8080"
    networks:
      - frontend_network
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-base-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      BACKEND_INTERNAL_URL: http://backend:8080
      BACKEND_AUTH_COOKIE_NAME: knowledge-base-session
    ports:
      - "3000:3000"
    networks:
      - frontend_network

volumes:
  postgres_data:

networks:
  frontend_network:
  backend_network:
