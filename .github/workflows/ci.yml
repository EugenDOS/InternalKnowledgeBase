name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run frontend tests with coverage
        run: npm test

      - name: Build frontend
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Normalize Gradle wrapper line endings
        run: sed -i 's/\r$//' gradlew

      - name: Run backend tests and coverage checks
        run: ./gradlew check

  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t knowledge-base-frontend:ci ./frontend

      - name: Build backend image
        run: docker build -t knowledge-base-backend:ci ./backend

      - name: Build postgres image
        run: docker build -t knowledge-base-postgres:ci -f Dockerfile.db .
